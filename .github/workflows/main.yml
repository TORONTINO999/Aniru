name: Build AnimeVost APK

on:
  schedule:
    - cron: '0 0 * * 0'   # Каждое воскресенье в 00:00
  workflow_dispatch:      # Ручной запуск
  push:
    branches: [ main, master ]

env:
  # Используем Node 24 для всех JavaScript-экшенов
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ==================== JOB 1: АНАЛИЗ САЙТА ====================
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    outputs:
      has_data: ${{ steps.check_data.outputs.has_data }}
      films_count: ${{ steps.check_data.outputs.films_count }}
    
    steps:
      # 1. Клонируем репозиторий (со всеми файлами)
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. Устанавливаем зависимости
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      # 4. Проверяем, что анализатор существует
      - name: Check analyzer exists
        run: |
          if [ -f analyzer/analyze_animevost.py ]; then
            echo "✅ Анализатор найден: analyzer/analyze_animevost.py"
          else
            echo "❌ Анализатор не найден! Создайте файл analyzer/analyze_animevost.py"
            exit 1
          fi

      # 5. Запускаем анализатор из репозитория
      - name: Run analyzer
        id: analyze
        run: |
          cd analyzer
          python analyze_animevost.py
          echo "✅ Анализатор завершил работу"

      # 6. Проверяем результат (файлы должны быть в analyzer/site_dump/)
      - name: Check data
        id: check_data
        run: |
          echo "📂 Проверка содержимого analyzer/:"
          ls -la analyzer/ || echo "❌ Папка analyzer не найдена"
          
          echo "📂 Проверка содержимого analyzer/site_dump/:"
          ls -la analyzer/site_dump/ || echo "❌ Папка site_dump не найдена"
          
          if [ -f analyzer/site_dump/films.json ]; then
            FILMS_COUNT=$(cat analyzer/site_dump/films.json | python -c "import sys, json; print(len(json.load(sys.stdin)))")
            echo "has_data=true" >> $GITHUB_OUTPUT
            echo "films_count=$FILMS_COUNT" >> $GITHUB_OUTPUT
            echo "✅ Найдено $FILMS_COUNT фильмов"
          else
            echo "has_data=false" >> $GITHUB_OUTPUT
            echo "❌ Файл films.json не создан!"
            echo "📂 Проверяем всё содержимое:"
            find . -name "*.json" 2>/dev/null || echo "JSON-файлы не найдены"
            exit 1
          fi

      # 7. Загружаем артефакты
      - name: Upload site dump
        uses: actions/upload-artifact@v4
        with:
          name: site-dump
          path: analyzer/site_dump/
          retention-days: 7

      - name: Upload films.json
        uses: actions/upload-artifact@v4
        with:
          name: films-data
          path: analyzer/site_dump/films.json
          retention-days: 7

  # ==================== JOB 2: СБОРКА APK ====================
  build-apk:
    needs: analyze
    runs-on: ubuntu-latest
    if: needs.analyze.outputs.has_data == 'true'
    timeout-minutes: 30
    
    steps:
      # 1. Клонируем репозиторий (для Android-проекта)
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Скачиваем данные из артефактов
      - name: Download films.json
        uses: actions/download-artifact@v4
        with:
          name: films-data
          path: android_app/app/src/main/assets/

      - name: Download full site dump
        uses: actions/download-artifact@v4
        with:
          name: site-dump
          path: android_app/app/src/main/assets/site_dump/

      # 3. Проверяем файлы
      - name: Verify files
        run: |
          echo "📂 Проверка файлов в assets:"
          ls -la android_app/app/src/main/assets/ || echo "❌ Папка assets не найдена"
          
          if [ -f android_app/app/src/main/assets/films.json ]; then
            echo "✅ films.json загружен"
            FILMS_COUNT=$(cat android_app/app/src/main/assets/films.json | python -c "import sys, json; print(len(json.load(sys.stdin)))")
            echo "📊 Фильмов в базе: $FILMS_COUNT"
          else
            echo "❌ films.json не найден!"
            exit 1
          fi

      # 4. Устанавливаем Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 5. Устанавливаем Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 6. Собираем APK
      - name: Build APK
        run: |
          cd android_app
          chmod +x gradlew
          ./gradlew assembleDebug

      # 7. Загружаем APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: animevost-app
          path: android_app/app/build/outputs/apk/debug/*.apk
          retention-days: 30
