name: Build AnimeVost APK

on:
  schedule:
    - cron: '0 0 * * 0'   # Раз в неделю
  workflow_dispatch:      # Ручной запуск
  push:
    branches: [ main ]

env:
  # Явно указываем использовать Node 24 для всех JavaScript-экшенов
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    outputs:
      has_data: ${{ steps.check.outputs.has_data }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd analyzer
          pip install -r requirements.txt

      - name: Run full analyzer
        id: analyze
        run: |
          cd analyzer
          python analyze_animevost.py
          # Проверяем, создался ли файл
          if [ -f site_dump/films.json ]; then
            echo "has_data=true" >> $GITHUB_OUTPUT
          fi

      - name: Check if data exists
        id: check
        run: |
          if [ -f analyzer/site_dump/films.json ]; then
            echo "has_data=true" >> $GITHUB_OUTPUT
            echo "✅ Данные успешно собраны"
          else
            echo "❌ Данные не собраны"
            echo "has_data=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload full site dump
        uses: actions/upload-artifact@v4
        with:
          name: site-dump
          path: analyzer/site_dump/
          retention-days: 7

      - name: Upload films.json
        uses: actions/upload-artifact@v4
        with:
          name: films-data
          path: analyzer/site_dump/films.json
          retention-days: 7

  build-apk:
    needs: analyze
    runs-on: ubuntu-latest
    if: needs.analyze.outputs.has_data == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download films.json
        uses: actions/download-artifact@v4
        with:
          name: films-data
          path: android_app/app/src/main/assets/

      - name: Download full site dump
        uses: actions/download-artifact@v4
        with:
          name: site-dump
          path: android_app/app/src/main/assets/site_dump/

      - name: Verify files
        run: |
          echo "📂 Проверка файлов в assets:"
          ls -la android_app/app/src/main/assets/
          echo "📂 Проверка site_dump:"
          ls -la android_app/app/src/main/assets/site_dump/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd android_app
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: animevost-app
          path: android_app/app/build/outputs/apk/debug/*.apk
          retention-days: 30
